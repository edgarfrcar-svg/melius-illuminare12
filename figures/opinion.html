<style>
  .op-app {
    display: grid;
    grid-template-columns: 260px 1fr;
    max-width: 1180px;
    margin: 0 auto;
    min-height: calc(100vh - 140px);
  }
  @media (max-width: 900px) {
    .op-app { grid-template-columns: 1fr; }
    .op-side { display: none; }
    .op-side.is-open {
      display: block; position: fixed; inset: 0; z-index: 90;
      background: var(--bg-deep, #0a0b0e); overflow-y: auto; padding: 1.25rem;
    }
  }
  .op-side {
    border-right: 1px solid var(--hairline);
    background: var(--bg-deep, rgba(8,9,12,0.98));
    padding: 1.25rem 1rem 2.5rem;
    position: sticky; top: 70px;
    max-height: calc(100vh - 70px);
    overflow-y: auto;
  }
  .op-side .label {
    font-family: var(--serif-display);
    font-size: 0.62rem; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--gold); margin: 1.1rem 0 0.45rem;
  }
  .op-side .label:first-child { margin-top: 0.15rem; }
  .op-side a {
    display: block; color: var(--ink-dim); text-decoration: none;
    font-size: 0.9rem; line-height: 1.35; padding: 0.38rem 0.5rem;
    border-radius: 3px; margin-bottom: 0.12rem;
  }
  .op-side a:hover, .op-side a.is-active {
    color: var(--gold-glow, #ffd98e); background: rgba(201,162,39,0.08);
  }
  .op-side .back {
    border: 1px solid var(--hairline); margin-bottom: 0.85rem; color: var(--ink);
  }
  .op-side .back:hover { border-color: var(--gold); }

  .op-main { padding: 1.75rem 2rem 4.5rem; max-width: 44rem; }
  @media (max-width: 900px) { .op-main { padding: 1.1rem 1.15rem 3.5rem; } }

  .op-toolbar {
    display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center;
    margin-bottom: 1.35rem; padding-bottom: 0.9rem;
    border-bottom: 1px solid var(--hairline);
    position: sticky; top: 70px; z-index: 5; background: var(--bg);
  }
  .op-toolbar a, .op-toolbar button {
    font-family: var(--serif-body); font-size: 0.86rem;
    background: var(--bg-panel); color: var(--ink);
    border: 1px solid var(--hairline); padding: 0.4rem 0.75rem;
    border-radius: 3px; cursor: pointer; text-decoration: none;
  }
  .op-toolbar a:hover, .op-toolbar button:hover {
    border-color: var(--gold); color: var(--gold-glow, #ffd98e);
  }

  .op-meta .eyebrow {
    font-family: var(--serif-display); font-size: 0.68rem;
    letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold);
  }
  .op-meta h1 {
    margin: 0.4rem 0 0.35rem;
    font-size: clamp(1.5rem, 3.2vw, 2.1rem); line-height: 1.2;
  }
  .op-meta .sub {
    color: var(--ink-dim); font-size: 0.95rem; margin-bottom: 1.5rem;
  }
  .op-meta .sub a { color: var(--gold); text-decoration: none; }
  .op-meta .sub a:hover { color: var(--gold-glow, #ffd98e); }

  .op-block { margin: 0 0 2.1rem; scroll-margin-top: 140px; }
  .op-block h2 {
    font-family: var(--serif-display); font-size: 0.72rem;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--gold); margin: 0 0 0.75rem; font-weight: 500;
  }
  .op-block h3 {
    font-family: var(--serif-display); font-size: 1.15rem;
    color: var(--gold-glow, var(--gold)); margin: 0 0 0.65rem; font-weight: 500;
  }
  .op-block p {
    margin: 0 0 0.9rem; line-height: 1.78; color: var(--ink-dim);
  }
  .op-block p:last-child { margin-bottom: 0; }

  .op-question {
    padding: 1.2rem 1.3rem; border-left: 3px solid var(--gold);
    background: linear-gradient(90deg, rgba(201,162,39,0.08), transparent 75%),
                var(--bg-panel, rgba(16,18,22,0.5));
    border-radius: 0 6px 6px 0; margin-bottom: 2rem;
  }
  .op-question p {
    margin: 0; font-size: clamp(1.12rem, 2.3vw, 1.35rem);
    font-style: italic; line-height: 1.45; color: var(--ink);
  }

  .op-quote {
    margin: 1rem 0 0; padding: 1.15rem 1.25rem;
    border: 1px solid var(--hairline); border-radius: 6px;
    background: rgba(8,9,12,0.4);
  }
  .op-quote p {
    margin: 0 0 0.65rem; font-style: italic; color: var(--ink); line-height: 1.7;
  }
  .op-quote cite {
    display: block; font-size: 0.85rem; color: var(--gold);
    font-style: normal; letter-spacing: 0.03em;
  }

  .op-related {
    display: flex; flex-wrap: wrap; gap: 0.5rem;
  }
  .op-related a {
    display: inline-block; padding: 0.45rem 0.75rem;
    border: 1px solid var(--hairline); border-radius: 4px;
    color: var(--ink); text-decoration: none; font-size: 0.9rem;
    background: var(--bg-panel);
  }
  .op-related a:hover {
    border-color: var(--gold); color: var(--gold-glow, #ffd98e);
  }
  .op-related span.note {
    display: block; font-size: 0.75rem; color: var(--ink-dim); margin-top: 0.15rem;
  }

  .op-missing { padding: 3rem 1.5rem; color: var(--ink-dim); text-align: center; }
</style>
</head>
